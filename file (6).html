<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>조선시대 역사 연표</title>
<style>
  :root{
    --bg:#f6f3ec;
    --ink:#2b2620;
    --sub:#7a7266;
    --line:#d8cfbe;
    --accent:#8b3a2f;
    --accent-soft:#f0dfd9;
    --card:#ffffff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    line-height:1.6;
    min-height:100vh;
  }

  /* ---------- 헤더 ---------- */
  header{
    padding:32px 24px 8px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:clamp(20px,3.4vw,30px);
    letter-spacing:-0.5px;
  }
  header p{
    margin:0;
    color:var(--sub);
    font-size:clamp(13px,1.8vw,15px);
  }

  /* ---------- 타임라인 ---------- */
  .timeline-wrap{
    position:relative;
    margin:24px 0 0;
  }
  .scroll-hint{
    text-align:center;
    font-size:12.5px;
    color:var(--sub);
    margin:0 0 10px;
  }
  .timeline{
    display:flex;
    align-items:flex-start;
    gap:0;
    overflow-x:auto;
    overflow-y:hidden;
    scroll-behavior:smooth;
    padding:56px 48px 64px;
    scrollbar-width:thin;
    cursor:grab;
  }
  .timeline.dragging{cursor:grabbing;scroll-behavior:auto;}
  .timeline::-webkit-scrollbar{height:10px;}
  .timeline::-webkit-scrollbar-track{background:transparent;}
  .timeline::-webkit-scrollbar-thumb{
    background:var(--line);border-radius:6px;
  }

  /* 가로 축선 */
  .axis{
    position:absolute;
    left:0;right:0;
    top:calc(56px + 22px);
    height:3px;
    background:linear-gradient(90deg,transparent,var(--line) 6%,var(--line) 94%,transparent);
    pointer-events:none;
  }

  .node-wrap{
    position:relative;
    flex:0 0 auto;
    width:150px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* 연도 라벨 */
  .year{
    font-size:15px;
    font-weight:700;
    letter-spacing:-0.3px;
    color:var(--sub);
    margin-bottom:8px;
    transition:color .3s, transform .3s;
  }
  .node-wrap.active .year{
    color:var(--accent);
    transform:scale(1.12);
  }

  /* 노드 점 */
  .node{
    position:relative;
    width:22px;height:22px;
    border-radius:50%;
    border:3px solid var(--card);
    background:var(--line);
    box-shadow:0 0 0 2px var(--line);
    cursor:pointer;
    padding:0;
    transition:background .3s, box-shadow .3s, transform .3s;
    z-index:2;
  }
  .node:hover{
    transform:scale(1.18);
    background:var(--accent);
    box-shadow:0 0 0 2px var(--accent);
  }
  .node:focus-visible{
    outline:3px solid var(--accent);
    outline-offset:4px;
  }
  .node-wrap.active .node{
    background:var(--accent);
    box-shadow:0 0 0 2px var(--accent), 0 0 0 9px var(--accent-soft);
    transform:scale(1.22);
  }
  /* 강조 펄스 */
  .node-wrap.active .node::after{
    content:"";
    position:absolute;
    inset:-4px;
    border-radius:50%;
    border:2px solid var(--accent);
    animation:pulse 1.6s ease-out infinite;
  }
  @keyframes pulse{
    0%{transform:scale(1);opacity:.55;}
    100%{transform:scale(2.2);opacity:0;}
  }

  /* 사건 제목 */
  .label{
    margin-top:14px;
    width:130px;
    text-align:center;
    font-size:13.5px;
    font-weight:600;
    color:var(--ink);
    cursor:pointer;
    background:none;border:0;padding:0;
    font-family:inherit;
    transition:color .3s;
  }
  .node-wrap.active .label{color:var(--accent);}
  .label:hover{color:var(--accent);}

  /* 연결선(점 → 제목) */
  .stem{
    width:2px;height:14px;
    background:var(--line);
    transition:background .3s;
  }
  .node-wrap.active .stem{background:var(--accent);}

  /* 교차 배치: 짝수 번째는 위쪽에 제목 */
  .node-wrap.above{flex-direction:column-reverse;}
  .node-wrap.above .stem{order:3;}
  .node-wrap.above .label{margin-top:0;margin-bottom:14px;}
  .node-wrap.above .year{margin-bottom:0;margin-top:8px;order:1;}
  .node-wrap.above .node{order:2;}
  .node-wrap.above .stem{order:3;}
  .node-wrap.above .label{order:4;}

  /* ---------- 팝업 ---------- */
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(43,38,32,.5);
    backdrop-filter:blur(3px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    opacity:0;
    visibility:hidden;
    transition:opacity .25s ease, visibility .25s;
    z-index:50;
  }
  .overlay.open{opacity:1;visibility:visible;}

  .popup{
    background:var(--card);
    border-radius:18px;
    max-width:520px;
    width:100%;
    max-height:86vh;
    overflow-y:auto;
    padding:28px 26px 26px;
    box-shadow:0 18px 50px rgba(0,0,0,.28);
    transform:translateY(18px) scale(.96);
    transition:transform .3s cubic-bezier(.2,.8,.3,1);
    position:relative;
  }
  .overlay.open .popup{transform:translateY(0) scale(1);}

  .popup .badge{
    display:inline-block;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:13px;
    font-weight:700;
    padding:4px 12px;
    border-radius:999px;
    margin-bottom:12px;
  }
  .popup h2{
    margin:0 0 14px;
    font-size:clamp(19px,3vw,24px);
    line-height:1.35;
    letter-spacing:-0.4px;
  }
  .popup p{
    margin:0 0 14px;
    font-size:15px;
    color:#433d36;
  }
  .popup .fact{
    background:#faf7f1;
    border-left:4px solid var(--accent);
    border-radius:0 10px 10px 0;
    padding:12px 14px;
    font-size:14px;
    color:#5b534a;
  }
  .popup .fact strong{color:var(--accent);}

  .popup .nav{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-top:22px;
  }
  .popup .nav button{
    flex:1;
    padding:11px 14px;
    border-radius:10px;
    border:1.5px solid var(--line);
    background:#fff;
    color:var(--ink);
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:background .2s,border-color .2s,color .2s;
  }
  .popup .nav button:hover:not(:disabled){
    background:var(--accent-soft);
    border-color:var(--accent);
    color:var(--accent);
  }
  .popup .nav button:disabled{opacity:.35;cursor:default;}

  .close{
    position:absolute;
    top:14px;right:14px;
    width:36px;height:36px;
    border-radius:50%;
    border:0;
    background:#f2ede4;
    color:var(--sub);
    font-size:18px;
    cursor:pointer;
    line-height:1;
  }
  .close:hover{background:var(--accent-soft);color:var(--accent);}

  @media (max-width:640px){
    header{padding:22px 16px 4px;}
    .timeline{padding:48px 28px 52px;}
    .axis{top:calc(48px + 22px);}
    .node-wrap{width:124px;}
    .label{width:110px;font-size:12.5px;}
    .popup{padding:24px 18px 20px;border-radius:14px;}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;}
    .timeline{scroll-behavior:auto;}
    .overlay,.popup{transition:none;}
  }
</style>
</head>
<body>

<header>
  <h1>조선시대 역사 연표</h1>
  <p>점을 눌러 사건을 확인해 보세요 · 좌우로 밀면 더 볼 수 있어요</p>
</header>

<div class="timeline-wrap">
  <p class="scroll-hint">← 옆으로 넘겨 보세요 →</p>
  <div class="axis"></div>
  <div class="timeline" id="timeline"></div>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="popup-title">
  <div class="popup">
    <button class="close" id="closeBtn" aria-label="닫기">✕</button>
    <span class="badge" id="popup-year"></span>
    <h2 id="popup-title"></h2>
    <p id="popup-desc"></p>
    <div class="fact" id="popup-fact"></div>
    <div class="nav">
      <button id="prevBtn">← 이전 사건</button>
      <button id="nextBtn">다음 사건 →</button>
    </div>
  </div>
</div>

<script>
const EVENTS = [
  { year:1392, title:"조선 건국", tag:"새 나라의 시작",
    desc:"고려의 장수였던 이성계가 새로운 나라 조선을 세웠어요. 나라 이름은 옛날 나라 '고조선'에서 따왔고, 수도는 한양으로 옮겼어요.",
    fact:"조선은 약 500년 동안 이어졌어요. 지금의 서울인 한양은 조선의 첫 수도였고요." },
  { year:1418, title:"세종대왕 즉위", tag:"훌륭한 임금",
    desc:"세종대왕이 왕이 되었어요. 그는 백성들이 편하게 살 수 있는 나라를 만들고 싶어 했어요. 과학, 음악, 농사 등 여러 분야를 발전시켰죠.",
    fact:"세종대왕은 '백성을 사랑한 임금'으로 가장 많이 기억되는 조선의 왕이에요." },
  { year:1443, title:"한글 창제", tag:"우리 글자의 탄생",
    desc:"세종대왕이 누구나 쉽게 배울 수 있는 글자, 훈민정음을 만들었어요. 이것이 오늘날 우리가 쓰는 한글이에요.",
    fact:"한글은 '아침'처럼 소리를 그대로 적을 수 있어서 배우기 아주 쉬운 글자입니다." },
  { year:1592, title:"임진왜란", tag:"7년의 전쟁",
    desc:"일본이 조선을 침략해 일어난 전쟁이에요. 이순신 장군이 바다에서 큰 승리를 거두었고, 전쟁은 7년 동안 이어졌어요.",
    fact:"거북선을 탄 이순신 장군의 함대는 한산도 대첩에서 크게 이겼습니다." },
  { year:1636, title:"병자호란", tag:"다시 찾아온 침략",
    desc:"청나라가 조선을 공격한 전쟁이에요. 한양이 함락되고 인조 임금은 남한산성으로 피했지만 끝까지 버티지 못했어요.",
    fact:"이 전쟁 이후 조선은 청나라에 굽히는 상황을 겪었지만, 스스로를 지키려는 노력은 계속됐어요." },
  { year:1724, title:"영조의 탕평책", tag:"사람을 고루 쓰다",
    desc:"영조 임금은 서로 편을 갈라 싸우던 신하들을 한쪽으로 몰지 않고 고루 등용했어요. 이를 탕평책이라고 해요.",
    fact:"영조는 오랫동안 나라를 다스리며 백성들의 세금을 줄이고 책을 만들었어요." },
  { year:1794, title:"수원 화성 축조", tag:"정조의 새 도시",
    desc:"정조 임금은 수원에 화성을 쌓았어요. 거중기 같은 새로운 기구를 써서 짧은 시간에 튼튼한 성을 완성했죠.",
    fact:"화성은 지금도 남아 있어 유네스코 세계문화유산으로 지정되어 있습니다." },
  { year:1866, title:"병인양요", tag:"문을 두드린 서양",
    desc:"프랑스 군대가 강화도를 공격한 사건이에요. 조선 군대는 힘을 합쳐 프랑스군을 물리쳤어요.",
    fact:"이때 프랑스군이 가져간 조선의 책들이 오랜 시간 뒤에 돌아오기도 했어요." },
  { year:1894, title:"동학농민운동", tag:"백성들이 일어나다",
    desc:"가난하고 억울한 백성들이 동학을 믿는 사람들을 중심으로 봉기했어요. 나라를 바르게 고치자는 것이었죠.",
    fact:"동학농민운동은 농민들이 스스로 목소리를 낸 우리 역사의 중요한 사건이에요." },
  { year:1897, title:"대한제국 선포", tag:"새로운 나라 이름",
    desc:"고종이 나라 이름을 '대한제국'으로 바꾸고 황제가 되었어요. 다른 나라에 지지 않겠다는 뜻을 나타낸 것이죠.",
    fact:"대한제국은 조선이 스스로를 지키려 했던 마지막 큰 노력 중 하나였습니다." }
];

const timeline = document.getElementById('timeline');
const overlay  = document.getElementById('overlay');
const popupYear = document.getElementById('popup-year');
const popupTitle= document.getElementById('popup-title');
const popupDesc = document.getElementById('popup-desc');
const popupFact = document.getElementById('popup-fact');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const closeBtn= document.getElementById('closeBtn');

let current = -1;
const nodes = [];

EVENTS.forEach((ev, i) => {
  const wrap = document.createElement('div');
  wrap.className = 'node-wrap' + (i % 2 === 1 ? ' above' : '');
  wrap.dataset.index = i;

  const year = document.createElement('div');
  year.className = 'year';
  year.textContent = ev.year + '년';

  const node = document.createElement('button');
  node.className = 'node';
  node.setAttribute('aria-label', ev.year + '년 ' + ev.title);
  node.addEventListener('click', () => select(i, true));

  const stem = document.createElement('div');
  stem.className = 'stem';

  const label = document.createElement('button');
  label.className = 'label';
  label.textContent = ev.title;
  label.addEventListener('click', () => select(i, true));

  wrap.append(year, node, stem, label);
  timeline.appendChild(wrap);
  nodes.push(wrap);
});

function select(i, openPopup){
  if (i < 0 || i >= EVENTS.length) return;

  nodes.forEach(n => n.classList.remove('active'));
  nodes[i].classList.add('active');
  current = i;

  centerOn(nodes[i]);

  if (openPopup) showPopup(i);
}

function centerOn(el){
  const target = el.offsetLeft + el.offsetWidth / 2 - timeline.clientWidth / 2;
  timeline.scrollTo({ left: Math.max(0, target), behavior: 'smooth' });
}

function showPopup(i){
  const ev = EVENTS[i];
  popupYear.textContent  = ev.year + '년';
  popupTitle.textContent = ev.title;
  popupDesc.textContent  = ev.desc;
  popupFact.innerHTML    = '<strong>' + ev.tag + '</strong> · ' + ev.fact;

  prevBtn.disabled = i === 0;
  nextBtn.disabled = i === EVENTS.length - 1;

  overlay.classList.add('open');
  closeBtn.focus();
}

function closePopup(){
  overlay.classList.remove('open');
  if (current >= 0) nodes[current].querySelector('.node').focus();
}

closeBtn.addEventListener('click', closePopup);
overlay.addEventListener('click', e => { if (e.target === overlay) closePopup(); });

prevBtn.addEventListener('click', () => select(current - 1, true));
nextBtn.addEventListener('click', () => select(current + 1, true));

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && overlay.classList.contains('open')) closePopup();
  if (!overlay.classList.contains('open')) {
    if (e.key === 'ArrowRight') select(Math.min(current + 1, EVENTS.length - 1), false);
    if (e.key === 'ArrowLeft')  select(Math.max(current - 1, 0), false);
  }
});

/* 마우스 드래그로 가로 스크롤 */
let down = false, startX = 0, startScroll = 0, moved = false;
timeline.addEventListener('mousedown', e => {
  down = true; moved = false;
  startX = e.pageX;
  startScroll = timeline.scrollLeft;
  timeline.classList.add('dragging');
});
window.addEventListener('mousemove', e => {
  if (!down) return;
  const dx = e.pageX - startX;
  if (Math.abs(dx) > 4) moved = true;
  timeline.scrollLeft = startScroll - dx;
});
window.addEventListener('mouseup', () => {
  down = false;
  timeline.classList.remove('dragging');
});
timeline.addEventListener('click', e => {
  if (moved) { e.preventDefault(); e.stopPropagation(); }
}, true);

/* 처음에는 가운데(임진왜란)를 살짝 보여줌 */
window.addEventListener('load', () => {
  const start = 3;
  nodes[start].classList.add('active');
  current = start;
  centerOn(nodes[start]);
});
</script>
</body>
</html>
