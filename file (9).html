<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>속담 이어말하기 게임</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    min-height: 100vh;
    background: linear-gradient(160deg, #1e3c72 0%, #2a5298 50%, #6a3093 100%);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; color: #fff; overflow-x: hidden;
  }
  .screen { display: none; width: 100%; max-width: 760px; }
  .screen.active { display: block; animation: fadeIn .4s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  .panel {
    background: rgba(255,255,255,.1);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 24px;
    padding: 36px 30px;
    box-shadow: 0 24px 60px rgba(0,0,0,.35);
  }

  /* ---------- 시작 화면 ---------- */
  h1 { font-size: 2.4rem; text-align: center; letter-spacing: -1px; text-shadow: 0 4px 18px rgba(0,0,0,.4); }
  h1 span { display: inline-block; transform: translateY(-2px); }
  .subtitle { text-align: center; margin-top: 14px; color: #d8e3ff; line-height: 1.7; font-size: 1rem; }
  .rule-box {
    margin-top: 26px; background: rgba(0,0,0,.18); border-radius: 16px; padding: 18px 20px;
    font-size: .95rem; line-height: 1.9; color: #eaf0ff;
  }
  .rule-box b { color: #ffd166; }
  .setting { margin-top: 28px; }
  .setting label { display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; font-size: 1.05rem; }
  .setting .value { color: #ffd166; font-size: 1.5rem; }
  input[type=range] { width: 100%; margin-top: 16px; -webkit-appearance: none; height: 10px; border-radius: 10px;
    background: linear-gradient(90deg, #ffd166, #ff6b6b); outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; border-radius: 50%;
    background: #fff; border: 4px solid #ff6b6b; cursor: pointer; box-shadow: 0 3px 10px rgba(0,0,0,.4); }
  .scale { display: flex; justify-content: space-between; font-size: .8rem; color: #c9d6f5; margin-top: 8px; }

  .btn-3d {
    display: block; width: 100%; margin-top: 32px; padding: 20px;
    font-size: 1.35rem; font-weight: 800; color: #2b1055; cursor: pointer;
    background: linear-gradient(180deg, #ffe89a, #ffc93c);
    border: none; border-radius: 18px;
    box-shadow: 0 8px 0 #c9971f, 0 14px 30px rgba(0,0,0,.35);
    transition: transform .08s, box-shadow .08s;
  }
  .btn-3d:active { transform: translateY(6px); box-shadow: 0 2px 0 #c9971f, 0 6px 14px rgba(0,0,0,.35); }

  /* ---------- HUD ---------- */
  .hud { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 18px; }
  .hud-item {
    background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.22);
    border-radius: 16px; padding: 12px 8px; text-align: center;
  }
  .hud-item .label { font-size: .78rem; color: #cfdcff; letter-spacing: 1px; }
  .hud-item .num { font-size: 1.6rem; font-weight: 800; color: #ffd166; font-variant-numeric: tabular-nums; }
  .hud-item.danger .num { color: #ff6b6b; animation: pulse .8s infinite; }
  @keyframes pulse { 50% { opacity: .45; } }

  .timebar { height: 12px; border-radius: 12px; background: rgba(0,0,0,.3); overflow: hidden; margin-bottom: 22px; }
  .timebar i { display: block; height: 100%; width: 100%; border-radius: 12px;
    background: linear-gradient(90deg, #43e97b, #ffd166, #ff6b6b); transition: width .3s linear; }

  .question-card { text-align: center; padding: 28px 18px; }
  .q-label { font-size: .9rem; color: #cfdcff; letter-spacing: 2px; }
  .q-front { font-size: clamp(1.9rem, 6vw, 2.8rem); font-weight: 800; margin: 16px 0 8px; text-shadow: 0 4px 14px rgba(0,0,0,.4); }
  .q-hint { min-height: 34px; font-size: 1.2rem; color: #9be7ff; letter-spacing: 6px; font-weight: 700; }
  .q-hint.hidden-message { letter-spacing: 0; color: #ffb3b3; }

  #answerInput {
    width: 100%; margin-top: 22px; padding: 18px; font-size: 1.35rem; font-weight: 700;
    text-align: center; border-radius: 16px; border: 3px solid rgba(255,255,255,.35);
    background: rgba(0,0,0,.25); color: #fff; outline: none;
  }
  #answerInput::placeholder { color: #93a4cc; font-weight: 500; }
  #answerInput:focus { border-color: #ffd166; box-shadow: 0 0 0 5px rgba(255,209,102,.2); }

  .controls { display: flex; gap: 12px; margin-top: 18px; }
  .btn { flex: 1; padding: 16px; font-size: 1.05rem; font-weight: 800; border: none; border-radius: 14px; cursor: pointer;
    transition: transform .08s; }
  .btn:active { transform: translateY(3px); }
  .btn-hint { background: linear-gradient(180deg, #7ee8fa, #3aa8d8); color: #06263a; box-shadow: 0 5px 0 #23718f; }
  .btn-hint:disabled { background: #5c6b8a; color: #b9c2d6; box-shadow: 0 5px 0 #3d4759; cursor: not-allowed; }
  .btn-submit { background: linear-gradient(180deg, #a8ff78, #4ad991); color: #05341d; box-shadow: 0 5px 0 #2c9a63; }
  .btn-skip { flex: 0 0 90px; background: rgba(255,255,255,.18); color: #e8eeff; box-shadow: 0 5px 0 rgba(0,0,0,.25); }

  .feedback { margin-top: 16px; min-height: 30px; text-align: center; font-size: 1.15rem; font-weight: 800; }
  .feedback.ok { color: #7dffb0; }
  .feedback.no { color: #ff9c9c; }

  /* ---------- 결과 화면 ---------- */
  .result-title { text-align: center; font-size: 2rem; font-weight: 800; }
  .score-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 22px; }
  .score-box { background: rgba(0,0,0,.22); border-radius: 18px; padding: 20px; text-align: center; }
  .score-box .k { font-size: .85rem; color: #cfdcff; }
  .score-box .v { font-size: 2.2rem; font-weight: 800; color: #ffd166; }
  .review-title { margin-top: 28px; font-size: 1.1rem; font-weight: 800; color: #ffd166; }
  .review-list { margin-top: 12px; max-height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  .review-item { background: rgba(0,0,0,.22); border-left: 5px solid #ff6b6b; border-radius: 12px; padding: 14px 16px; line-height: 1.7; font-size: .95rem; }
  .review-item .wrong { color: #ff9c9c; }
  .review-item .right { color: #7dffb0; font-weight: 800; }
  .perfect { text-align: center; padding: 20px; color: #7dffb0; font-weight: 800; }

  #fireworks { position: fixed; inset: 0; pointer-events: none; z-index: 999; }
</style>
</head>
<body>

<canvas id="fireworks"></canvas>

<!-- ===================== 시작 화면 ===================== -->
<section id="screen-start" class="screen active">
  <div class="panel">
    <h1><span>🎯</span> 속담 이어말하기 <span>🎯</span></h1>
    <p class="subtitle">
      앞부분을 보고 뒷부분을 맞혀 보세요!<br>
      시간 안에 최대한 많은 속담을 완성하는 게임이에요.
    </p>

    <div class="rule-box">
      <b>게임 방법</b><br>
      1. 속담의 앞부분이 큰 글씨로 나와요.<br>
      2. 뒷부분을 입력하고 <b>엔터</b> 또는 <b>정답 확인</b>을 눌러요.<br>
      3. 막히면 <b>초성 힌트</b>를 최대 <b>2번</b>까지 쓸 수 있어요.<br>
      4. 정답을 맞히면 폭죽이 터지고 1초 뒤 다음 문제로 넘어가요!
    </div>

    <div class="setting">
      <label>⏱ 제한시간 <span class="value"><span id="timeLabel">60</span>초</span></label>
      <input type="range" id="timeSlider" min="30" max="300" step="10" value="60">
      <div class="scale"><span>30초</span><span>300초</span></div>
    </div>

    <button class="btn-3d" id="startBtn">게임 시작!</button>
  </div>
</section>

<!-- ===================== 게임 화면 ===================== -->
<section id="screen-game" class="screen">
  <div class="hud">
    <div class="hud-item"><div class="label">점수</div><div class="num" id="hudScore">0</div></div>
    <div class="hud-item"><div class="label">문제</div><div class="num" id="hudProgress">1</div></div>
    <div class="hud-item" id="timeBox"><div class="label">남은 시간</div><div class="num" id="hudTime">60</div></div>
  </div>
  <div class="timebar"><i id="timeFill"></i></div>

  <div class="panel">
    <div class="question-card">
      <div class="q-label">이 속담의 뒷부분은?</div>
      <div class="q-front" id="qFront">콩 심은 데</div>
      <div class="q-hint" id="qHint"></div>
    </div>

    <input type="text" id="answerInput" placeholder="뒷부분을 입력하세요" autocomplete="off">

    <div class="controls">
      <button class="btn btn-hint" id="hintBtn">💡 초성 힌트 (2)</button>
      <button class="btn btn-submit" id="submitBtn">정답 확인</button>
      <button class="btn btn-skip" id="skipBtn">넘기기</button>
    </div>
    <div class="feedback" id="feedback"></div>
  </div>
</section>

<!-- ===================== 결과 화면 ===================== -->
<section id="screen-result" class="screen">
  <div class="panel">
    <div class="result-title" id="resultTitle">게임 끝!</div>
    <div class="score-row">
      <div class="score-box"><div class="k">맞춘 개수</div><div class="v" id="finalScore">0</div></div>
      <div class="score-box"><div class="k">남은 시간</div><div class="v" id="finalTime">0초</div></div>
    </div>

    <div class="review-title" id="reviewTitle">📝 오답 해설</div>
    <div class="review-list" id="reviewList"></div>

    <button class="btn-3d" id="retryBtn">다시 도전!</button>
  </div>
</section>

<script>
/* ============================================================
   문제 데이터 — CSV 내용을 그대로 옮겨 담았습니다.
   문제를 바꾸려면 이 배열만 수정하세요.
   ============================================================ */
const PROVERBS = [
  ["가는 말이", "고와야 오는 말이 곱다"],
  ["가는 날이", "장날이다"],
  ["고래 싸움에", "새우 등 터진다"],
  ["공든 탑이", "무너지랴"],
  ["구슬이 서 말이라도", "꿰어야 보배다"],
  ["금강산도", "식후경"],
  ["꿩 대신", "닭"],
  ["낮말은", "새가 듣고 밤말은 쥐가 듣는다"],
  ["누워서", "떡 먹기"],
  ["다 된 밥에", "재 뿌리기"],
  ["닭 쫓던 개", "지붕 쳐다본다"],
  ["도토리", "키 재기"],
  ["돌다리도", "두들겨 보고 건너라"],
  ["등잔 밑이", "어둡다"],
  ["땅 짚고", "헤엄치기"],
  ["뛰는 놈 위에", "나는 놈 있다"],
  ["말 한마디에", "천 냥 빚도 갚는다"],
  ["믿는 도끼에", "발등 찍힌다"],
  ["바늘 도둑이", "소 도둑 된다"],
  ["백지장도", "맞들면 낫다"],
  ["보기 좋은 떡이", "먹기도 좋다"],
  ["빈 수레가", "요란하다"],
  ["사공이 많으면", "배가 산으로 간다"],
  ["서당 개 삼 년이면", "풍월을 읊는다"],
  ["세 살 버릇", "여든까지 간다"],
  ["소 잃고", "외양간 고친다"],
  ["시작이", "반이다"],
  ["아니 땐 굴뚝에", "연기 나랴"],
  ["열 번 찍어", "안 넘어가는 나무 없다"],
  ["오르지 못할 나무는", "쳐다보지도 마라"],
  ["우물 안", "개구리"],
  ["원숭이도", "나무에서 떨어진다"],
  ["윗물이", "맑아야 아랫물이 맑다"],
  ["자라 보고 놀란 가슴", "솥뚜껑 보고 놀란다"],
  ["작은 고추가", "맵다"],
  ["종로에서 뺨 맞고", "한강에서 눈 흘긴다"],
  ["쥐구멍에도", "볕 들 날 있다"],
  ["티끌 모아", "태산"],
  ["팔은", "안으로 굽는다"],
  ["하나를 보면", "열을 안다"],
  ["하늘의", "별 따기"],
  ["호랑이도 제 말 하면", "온다"],
  ["콩 심은 데", "콩 나고 팥 심은 데 팥 난다"],
  ["꿩 먹고", "알 먹기"],
  ["남의 떡이", "더 커 보인다"],
  ["누워서", "침 뱉기"],
  ["믿는 구석이", "있다"],
  ["미운 놈", "떡 하나 더 준다"],
  ["싼 게", "비지떡"],
  ["천 리 길도", "한 걸음부터"]
];

/* ---------- 상수 ---------- */
const HANGUL_CHOSEONG = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
const MAX_HINTS = 2;

/* ---------- 상태 ---------- */
let queue = [];          // 이번 게임의 문제 순서
let current = null;      // 현재 문제
let score = 0;           // 맞춘 개수
let solvedCount = 0;     // 푼 문제 수 (진행 표시)
let hintsLeft = MAX_HINTS;
let wrongList = [];      // {front, answer, userAnswer, skipped}
let totalTime = 60;
let timeLeft = 60;
let timerId = null;
let locked = false;      // 정답 처리 중 입력 잠금

/* ---------- DOM ---------- */
const $ = id => document.getElementById(id);
const screens = { start: $("screen-start"), game: $("screen-game"), result: $("screen-result") };

function showScreen(name) {
  Object.values(screens).forEach(s => s.classList.remove("active"));
  screens[name].classList.add("active");
}

/* ============================================================
   유틸
   ============================================================ */
// 비교용 정규화: 공백·문장부호 제거
function normalize(text) {
  return String(text)
    .replace(/\s+/g, "")
    .replace(/[.,!?~'"“”‘’·…\-]/g, "")
    .trim();
}

// 초성 추출 (한글 음절만 처리, 공백 유지)
function toChoseong(text) {
  return [...text].map(ch => {
    const code = ch.charCodeAt(0);
    if (code >= 0xAC00 && code <= 0xD7A3) {
      return HANGUL_CHOSEONG[Math.floor((code - 0xAC00) / 588)];
    }
    return ch; // 공백·기타 문자는 그대로
  }).join("");
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ============================================================
   시작 화면
   ============================================================ */
$("timeSlider").addEventListener("input", e => {
  $("timeLabel").textContent = e.target.value;
});

$("startBtn").addEventListener("click", startGame);

function startGame() {
  totalTime = Number($("timeSlider").value);
  timeLeft = totalTime;
  queue = shuffle(PROVERBS);
  score = 0;
  solvedCount = 0;
  wrongList = [];
  locked = false;

  $("hudScore").textContent = "0";
  updateTimeUI();
  showScreen("game");
  nextQuestion();
  startTimer();
}

/* ============================================================
   타이머
   ============================================================ */
function startTimer() {
  clearInterval(timerId);
  timerId = setInterval(() => {
    timeLeft--;
    updateTimeUI();
    if (timeLeft <= 0) {
      clearInterval(timerId);
      endGame();
    }
  }, 1000);
}

function updateTimeUI() {
  $("hudTime").textContent = Math.max(0, timeLeft);
  $("timeFill").style.width = (Math.max(0, timeLeft) / totalTime * 100) + "%";
  $("timeBox").classList.toggle("danger", timeLeft <= 10);
}

/* ============================================================
   문제 진행
   ============================================================ */
function nextQuestion() {
  if (queue.length === 0) { endGame(); return; }

  current = queue.shift();
  hintsLeft = MAX_HINTS;
  locked = false;

  $("qFront").textContent = current[0];
  $("qHint").textContent = "";
  $("qHint").classList.remove("hidden-message");
  $("feedback").textContent = "";
  $("feedback").className = "feedback";
  $("hintBtn").disabled = false;
  $("hintBtn").textContent = `💡 초성 힌트 (${hintsLeft})`;

  $("hudProgress").textContent = solvedCount + 1;

  const input = $("answerInput");
  input.value = "";
  input.disabled = false;
  input.focus();
}

/* ============================================================
   힌트
   ============================================================ */
$("hintBtn").addEventListener("click", () => {
  if (hintsLeft <= 0 || locked) return;
  hintsLeft--;

  const answer = current[1];
  const hintEl = $("qHint");

  if (hintsLeft >= 1) {
    // 1회차: 초성 힌트
    hintEl.classList.remove("hidden-message");
    hintEl.textContent = toChoseong(answer);
  } else {
    // 2회차: 글자 수 + 첫 글자까지
    hintEl.classList.add("hidden-message");
    hintEl.textContent = `총 ${normalize(answer).length}글자 · 첫 글자 "${answer.trim()[0]}"`;
  }

  $("hintBtn").textContent = `💡 초성 힌트 (${hintsLeft})`;
  if (hintsLeft === 0) $("hintBtn").disabled = true;
});

/* ============================================================
   정답 확인
   ============================================================ */
$("submitBtn").addEventListener("click", submitAnswer);
$("answerInput").addEventListener("keydown", e => {
  if (e.key === "Enter") submitAnswer();
});
$("skipBtn").addEventListener("click", () => {
  if (locked) return;
  recordWrong("", true);
  advance();
});

function submitAnswer() {
  if (locked) return;

  const input = $("answerInput");
  const userAnswer = input.value.trim();

  if (userAnswer === "") {
    $("feedback").className = "feedback no";
    $("feedback").textContent = "답을 입력해 주세요!";
    return;
  }

  const isCorrect = normalize(userAnswer) === normalize(current[1]);

  if (isCorrect) {
    locked = true;
    input.disabled = true;
    score++;
    solvedCount++;
    $("hudScore").textContent = score;
    $("feedback").className = "feedback ok";
    $("feedback").textContent = "🎉 정답이에요!";
    launchFireworks();
    setTimeout(advance, 1000);   // 1초 뒤 다음 문제
  } else {
    $("feedback").className = "feedback no";
    $("feedback").textContent = "아쉬워요, 다시 생각해 보세요!";
    input.select();
  }
}

function recordWrong(userAnswer, skipped) {
  wrongList.push({
    front: current[0],
    answer: current[1],
    userAnswer: userAnswer,
    skipped: !!skipped
  });
  solvedCount++;
}

function advance() {
  clearTimeout(advance._t);
  advance._t = setTimeout(() => {
    locked = false;
    if (timeLeft <= 0) endGame();
    else nextQuestion();
  }, 0);
  if (timeLeft > 0) nextQuestion = nextQuestion; // no-op
  // 아래에서 직접 다음 문제 호출
}
/* advance가 1초 뒤 호출되는 흐름을 단순화 */
function goNext() {
  locked = false;
  if (timeLeft <= 0) endGame();
  else nextQuestion();
}

/* ============================================================
   게임 종료
   ============================================================ */
function endGame() {
  clearInterval(timerId);
  clearTimeout(advance._t);
  locked = true;

  $("finalScore").textContent = score;
  $("finalTime").textContent = Math.max(0, timeLeft) + "초";

  const total = PROVERBS.length;
  if (score >= total) {
    $("resultTitle").textContent = "🏆 완벽해요! 전부 맞혔어요!";
  } else if (score >= total * 0.7) {
    $("resultTitle").textContent = "🌟 아주 잘했어요!";
  } else if (score >= total * 0.4) {
    $("resultTitle").textContent = "👍 잘하고 있어요!";
  } else {
    $("resultTitle").textContent = "💪 조금 더 연습해 봐요!";
  }

  const list = $("reviewList");
  list.innerHTML = "";

  if (wrongList.length === 0) {
    const p = document.createElement("div");
    p.className = "perfect";
    p.textContent = "틀린 문제가 하나도 없어요! 최고예요 🎊";
    list.appendChild(p);
    $("reviewTitle").textContent = "📝 해설";
  } else {
    $("reviewTitle").textContent = `📝 오답 해설 (${wrongList.length}개)`;
    wrongList.forEach((w, i) => {
      const item = document.createElement("div");
      item.className = "review-item";

      const head = document.createElement("div");
      head.textContent = `${i + 1}. ${w.front} ______`;

      const ans = document.createElement("div");
      ans.innerHTML = `정답: <span class="right">${w.answer}</span>`;

      const mine = document.createElement("div");
      if (w.skipped) {
        mine.innerHTML = `<span class="wrong">넘어간 문제예요</span>`;
      } else {
        mine.innerHTML = `내 답: <span class="wrong">${w.userAnswer}</span>`;
      }

      item.append(head, ans, mine);
      list.appendChild(item);
    });
  }

  showScreen("result");
}

$("retryBtn").addEventListener("click", () => {
  showScreen("start");
});

/* ============================================================
   폭죽 애니메이션 (Canvas)
   ============================================================ */
const canvas = $("fireworks");
const ctx = canvas.getContext("2d");
let particles = [];
let animId = null;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

function launchFireworks() {
  const colors = ["#ffd166", "#ff6b6b", "#4ad991", "#7ee8fa", "#c084fc", "#fff"];
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;

  // 중심 + 좌우 상단에서 터지는 3발
  const bursts = [
    { x: cx, y: cy * 0.75, n: 70 },
    { x: cx * 0.45, y: cy * 0.45, n: 45 },
    { x: cx * 1.55, y: cy * 0.5, n: 45 }
  ];

  bursts.forEach(b => {
    for (let i = 0; i < b.n; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 7 + 2;
      particles.push({
        x: b.x, y: b.y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        decay: Math.random() * 0.015 + 0.01,
        size: Math.random() * 3 + 2,
        color: colors[Math.floor(Math.random() * colors.length)]
      });
    }
  });

  if (!animId) animateFireworks();
}

function animateFireworks() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.08;          // 중력
    p.vx *= 0.99;
    p.vy *= 0.99;
    p.life -= p.decay;

    if (p.life > 0) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
  });

  particles = particles.filter(p => p.life > 0);
  ctx.globalAlpha = 1;

  if (particles.length > 0) {
    animId = requestAnimationFrame(animateFireworks);
  } else {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    animId = null;
  }
}
</script>
