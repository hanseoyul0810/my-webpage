<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>독도의 날 퀴즈</title>
<style>
  :root{
    --blue:#1e5fa8; --sky:#e8f2fd; --green:#22a06b; --red:#e0533d;
    --amber:#e8a33d; --ink:#17202a; --line:#d7e3f0;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; min-height:100vh; font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:linear-gradient(180deg,#f7fbff 0%,#eaf3fd 100%);
    color:var(--ink); display:flex; justify-content:center; padding:20px;
  }
  .app{width:100%; max-width:760px;}

  /* ---------- 시작 화면 ---------- */
  .start{background:#fff; border:2px solid var(--line); border-radius:24px;
    padding:36px 28px; text-align:center; box-shadow:0 8px 24px rgba(30,95,168,.08);}
  .start h1{font-size:34px; margin:0 0 8px; color:var(--blue);}
  .start .sub{font-size:16px; color:#5b7186; margin-bottom:22px; line-height:1.7;}
  .badge{display:inline-block; background:var(--sky); color:var(--blue); font-weight:700;
    border-radius:999px; padding:8px 18px; margin-bottom:20px; font-size:15px;}
  .rules{background:#f9fcff; border:2px dashed var(--line); border-radius:16px;
    padding:16px 18px; text-align:left; font-size:15px; line-height:1.8;
    color:#4a6076; margin-bottom:24px;}
  .rules b{color:var(--blue);}
  .btn{border:none; border-radius:16px; font-family:inherit; font-weight:700;
    cursor:pointer; font-size:19px; padding:18px 32px; min-height:60px;
    transition:transform .08s ease, box-shadow .15s ease;}
  .btn:active{transform:scale(.97);}
  .btn-main{background:var(--blue); color:#fff; width:100%; box-shadow:0 6px 0 #14456f;}
  .btn-main:active{box-shadow:0 3px 0 #14456f; transform:translateY(3px) scale(.99);}

  /* ---------- 퀴즈 화면 ---------- */
  .quiz{display:none;}
  .topbar{display:flex; justify-content:space-between; align-items:center;
    margin-bottom:14px; font-weight:700; color:var(--blue); font-size:16px;}
  .progress{height:14px; background:#fff; border-radius:999px; overflow:hidden;
    border:2px solid var(--line); margin-bottom:20px;}
  .progress > i{display:block; height:100%; width:0;
    background:linear-gradient(90deg,#4a9eec,#1e5fa8); transition:width .3s ease;}

  .card{background:#fff; border:2px solid var(--line); border-radius:24px;
    padding:26px 24px 30px; box-shadow:0 8px 24px rgba(30,95,168,.08);}
  .qhead{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
  .qtext{font-size:23px; font-weight:700; line-height:1.5; margin:0 0 22px;}
  .trybadge{font-size:14px; font-weight:700; border-radius:999px;
    padding:6px 14px; background:var(--sky); color:var(--blue); white-space:nowrap;}
  .trybadge.warn{background:#fdf1e0; color:#a86a12;}

  .answers{display:grid; gap:14px;}
  .ans{display:flex; align-items:center; gap:14px; text-align:left;
    background:#f9fcff; border:2px solid var(--line); border-radius:18px;
    padding:18px; font-size:19px; font-weight:600; color:var(--ink);
    font-family:inherit; cursor:pointer; min-height:64px; width:100%;
    transition:background .15s, border-color .15s, transform .08s, opacity .2s;}
  .ans:active{transform:scale(.985);}
  .ans .num{flex:0 0 34px; height:34px; border-radius:50%; background:var(--sky);
    color:var(--blue); display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:16px;}
  .ans:hover:not(.locked){border-color:#9cc6ee;}
  .ans.correct{background:#e6f8f0; border-color:var(--green);}
  .ans.correct .num{background:var(--green); color:#fff;}
  .ans.wrong{background:#fdeceb; border-color:var(--red);}
  .ans.wrong .num{background:var(--red); color:#fff;}
  .ans.dead{opacity:.4; background:#f4f6f8; border-color:#e3e8ed; cursor:default;}
  .ans.locked{cursor:default;}

  .feedback{margin-top:18px; border-radius:16px; padding:16px 18px; font-size:18px;
    font-weight:700; display:none; animation:pop .25s ease;}
  .feedback.show{display:block;}
  .feedback.ok{background:#e6f8f0; color:#14724c; border:2px solid var(--green);}
  .feedback.no{background:#fdeceb; color:#a8341f; border:2px solid var(--red);}
  .feedback.over{background:#fdf1e0; color:#8a5a10; border:2px solid var(--amber);}
  .feedback .hint{display:block; font-size:15px; font-weight:600; color:#6b7f92; margin-top:6px;}

  @keyframes pop{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}
    40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
  .shake{animation:shake .4s ease;}

  .nextwrap{text-align:right; margin-top:20px;}
  .btn-next{background:var(--blue); color:#fff; padding:16px 34px;}
  .btn-next[hidden]{display:none;}

  /* ---------- 결과 화면 ---------- */
  .result{display:none;}
  .result .card{text-align:center;}
  .score-num{font-size:64px; font-weight:800; color:var(--blue); line-height:1; margin:10px 0;}
  .score-num span{font-size:26px; color:#7d93a8;}
  .stars{font-size:40px; letter-spacing:6px; margin:6px 0 4px;}
  .result-msg{font-size:20px; font-weight:700; margin:12px 0 4px;}
  .result-sub{font-size:16px; color:#5b7186; line-height:1.6; margin-bottom:18px;}
  .round-info{display:inline-block; background:var(--sky); color:var(--blue);
    font-size:14px; font-weight:700; border-radius:999px; padding:8px 16px; margin-bottom:22px;}
  .statrow{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:24px;}
  .stat{background:#f9fcff; border:2px solid var(--line); border-radius:14px; padding:12px 8px;}
  .stat b{display:block; font-size:22px; color:var(--blue);}
  .stat span{font-size:13px; color:#5b7186;}
  .review{text-align:left; margin:0 0 24px; border-top:2px solid var(--line); padding-top:16px;}
  .review h3{font-size:17px; margin:0 0 12px; color:var(--blue);}
  .review li{font-size:15px; line-height:1.6; margin-bottom:12px; list-style:none;}
  .review li b{display:block;}
  .review .me{color:#a8341f;}
  .review .co{color:#14724c;}
  .btn-redo{background:#fff; color:var(--blue); border:2px solid var(--blue); width:100%;}

  @media (max-width:480px){
    .qtext{font-size:20px;} .ans{font-size:17px; padding:16px;}
    .start h1{font-size:27px;} .score-num{font-size:52px;}
    .statrow{grid-template-columns:1fr 1fr 1fr;}
    .stat b{font-size:19px;}
  }
</style>
</head>
<body>
<div class="app">

  <!-- 시작 -->
  <section class="start" id="startScreen">
    <div class="badge">🇰🇷 10월 25일 · 독도의 날</div>
    <h1>독도의 날 퀴즈</h1>
    <p class="sub">4지선다 10문제, 만점 100점!<br>정답을 맞힐 때까지 몇 번이든 다시 고를 수 있어요.</p>
    <div class="rules">
      <b>📋 규칙</b><br>
      · 1번 만에 정답 → <b>10점</b><br>
      · 2번 만에 정답 → <b>7점</b><br>
      · 3번 만에 정답 → <b>4점</b><br>
      · 4번 만에 정답 → <b>2점</b><br>
      · 4번 모두 오답 → <b>0점</b><br>
      · 다시 도전하면 이전 문제는 <b>3개까지만</b> 나오고 나머지는 새 문제!
    </div>
    <button class="btn btn-main" id="startBtn">퀴즈 시작하기</button>
  </section>

  <!-- 퀴즈 -->
  <section class="quiz" id="quizScreen">
    <div class="topbar">
      <div id="counter">문제 1 / 10</div>
      <div id="liveScore">현재 0점</div>
    </div>
    <div class="progress"><i id="progressBar"></i></div>
    <div class="card">
      <div class="qhead">
        <div class="trybadge" id="tryBadge">시도 1 / 4</div>
      </div>
      <p class="qtext" id="questionText">문제</p>
      <div class="answers" id="answers"></div>
      <div class="feedback" id="feedback"></div>
      <div class="nextwrap"><button class="btn btn-next" id="nextBtn" hidden>다음 문제 →</button></div>
    </div>
  </section>

  <!-- 결과 -->
  <section class="result" id="resultScreen">
    <div class="card">
      <div class="stars" id="stars">⭐</div>
      <div class="score-num" id="finalScore">0<span> / 100</span></div>
      <p class="result-msg" id="resultMsg"></p>
      <p class="result-sub" id="resultSub"></p>
      <div class="round-info" id="roundInfo"></div>

      <div class="statrow">
        <div class="stat"><b id="stPerfect">0</b><span>한 번에 정답</span></div>
        <div class="stat"><b id="stRetry">0</b><span>다시 맞힌 문제</span></div>
        <div class="stat"><b id="stMiss">0</b><span>못 맞힌 문제</span></div>
      </div>

      <ul class="review" id="reviewList"></ul>
      <button class="btn btn-redo" id="redoBtn">다시 도전하기 🔁</button>
    </div>
  </section>

</div>

<script>
/* ===== 1. 문제 은행 (독도의 날 · 초등 눈높이) 20문항 ===== */
const BANK = [
  { q:"독도의 날은 몇 월 며칠일까요?",
    a:["10월 25일","3월 1일","8월 15일","5월 5일"], c:0,
    why:"독도의 날은 10월 25일이에요. 1900년 10월 25일 대한제국이 독도를 우리 영토로 알린 날이에요." },
  { q:"독도는 어느 나라의 영토일까요?",
    a:["일본","대한민국","중국","러시아"], c:1,
    why:"독도는 대한민국의 영토예요. 우리 조상들이 오래전부터 지켜 온 섬이에요." },
  { q:"독도는 우리나라 어느 지역에 속할까요?",
    a:["경상북도 울릉군","제주특별자치도","전라남도 여수시","강원특별자치도 속초시"], c:0,
    why:"독도는 경상북도 울릉군에 속해 있어요. 울릉도에서 동쪽으로 조금 더 가면 독도가 보여요." },
  { q:"독도에 가장 가까운 우리나라 섬은 어디일까요?",
    a:["제주도","울릉도","거제도","백령도"], c:1,
    why:"울릉도에서 독도까지는 약 87km예요. 배로 3시간쯤 걸리는 가까운 이웃 섬이에요." },
  { q:"독도는 어떻게 만들어진 섬일까요?",
    a:["모래로 만들어진 섬","화산이 분출해서 만들어진 섬","사람이 만든 인공 섬","얼음으로 덮인 섬"], c:1,
    why:"독도는 오래전 화산 활동으로 만들어진 화산섬이에요. 바위가 많고 모래는 거의 없어요." },
  { q:"독도를 이루고 있는 두 개의 큰 섬은 무엇일까요?",
    a:["동도와 서도","북도와 남도","큰도와 작은도","아침도와 저녁도"], c:0,
    why:"독도는 동도와 서도, 두 개의 큰 섬과 주변의 작은 바위들로 이루어져 있어요." },
  { q:"독도 주변 바다에 살았던 것으로 유명한 동물은 무엇일까요?",
    a:["펭귄","북극곰","강치(바다사자)","코끼리물범"], c:2,
    why:"독도에는 옛날에 강치(바다사자)가 많이 살았어요. 지금은 볼 수 없어 안타까운 동물이에요." },
  { q:"독도가 우리 땅임을 알려 주는 옛 지도와 책을 무엇이라고 할까요?",
    a:["증거 자료","광고 자료","장난 자료","빈 종이"], c:0,
    why:"옛 지도와 책은 독도가 우리 땅임을 보여 주는 소중한 증거 자료예요." },
  { q:"독도를 지키는 일을 하는 사람들은 누구일까요?",
    a:["독도 경비대와 독도 주민","외국 관광객","영화배우","우리나라에 오지 않는 사람"], c:0,
    why:"독도 경비대와 독도에 사는 주민들이 독도를 지키고 있어요." },
  { q:"우리가 독도를 사랑하는 방법으로 알맞은 것은 무엇일까요?",
    a:["독도를 남의 땅이라고 말하기","독도를 모르는 척하기",
       "독도를 바르게 알고 친구들에게 알려 주기","독도가 없다고 우기기"], c:2,
    why:"독도를 바르게 알고 친구들에게 알려 주는 것이 독도를 사랑하는 가장 좋은 방법이에요!" },

  { q:"독도에 대한 옛 이름이 아닌 것은 무엇일까요?",
    a:["우산도","가지도","삼봉도","한라산"], c:3,
    why:"독도는 우산도, 가지도, 삼봉도 등 여러 이름으로 불렸어요. 한라산은 제주도의 산이에요." },
  { q:"독도가 사람이 살기 어려운 까닭은 무엇일까요?",
    a:["물이 많아서","바위투성이이고 물을 구하기 어려워서","눈이 너무 많이 와서","나무가 너무 많아서"], c:1,
    why:"독도는 바위투성이에 마실 물을 구하기 어려워서 사람이 살기 힘든 섬이에요." },
  { q:"독도와 울릉도는 어느 바다에 있을까요?",
    a:["동해","서해","남해","지중해"], c:0,
    why:"독도와 울릉도는 우리나라 동쪽 바다인 동해에 있어요." },
  { q:"독도에 사는 새로 유명한 것은 무엇일까요?",
    a:["타조","괭이갈매기","앵무새","독수리"], c:1,
    why:"독도에는 괭이갈매기가 많이 살아요. 천연기념물로 보호받고 있어요." },
  { q:"독도 주변 바다에서 많이 잡히는 것은 무엇일까요?",
    a:["오징어와 명태 같은 물고기","바나나","사탕수수","코코넛"], c:0,
    why:"독도 주변은 오징어, 명태 같은 물고기가 많이 잡히는 좋은 어장이에요." },
  { q:"독도를 알리는 데 사용되는 우리나라 우표나 동전에 독도가 나온 적이 있을까요?",
    a:["전혀 없다","있다","외국에만 있다","누구도 모른다"], c:1,
    why:"독도는 우표와 동전 등에도 그려져 우리 영토임을 널리 알리고 있어요." },
  { q:"다음 중 독도가 우리 땅임을 보여 주는 것은 무엇일까요?",
    a:["옛날부터 우리 조상들이 독도를 알고 지켰다는 기록","다른 나라의 교과서","인터넷 댓글","만화책"], c:0,
    why:"옛 기록과 지도에 독도가 우리 땅으로 나와 있어요. 이것이 가장 확실한 증거예요." },
  { q:"독도를 방문하려면 주로 무엇을 타고 갈까요?",
    a:["비행기","배","기차","자전거"], c:1,
    why:"독도는 배를 타고 가야 해요. 울릉도에서 배로 약 3시간 걸려요." },
  { q:"독도가 속한 나라의 수도는 어디일까요?",
    a:["도쿄","베이징","서울","모스크바"], c:2,
    why:"독도는 대한민국의 영토이고, 대한민국의 수도는 서울이에요." },
  { q:"독도를 사랑하는 마음을 담아 자주 부르는 노래는 무엇일까요?",
    a:["독도는 우리 땅","애국가","아리랑","학교 종소리"], c:0,
    why:"'독도는 우리 땅'은 독도를 사랑하는 마음을 담은 노래예요. 다 같이 불러 봐요!" }
];

const PICK = 10;               // 한 회차 문제 수
const MAX_TRY = 4;             // 문제당 최대 시도
const REUSE_MAX = 3;           // 재도전 시 다시 나올 수 있는 이전 문제 수
const POINTS = [10, 7, 4, 2];  // 1·2·3·4번째 시도 정답 점수
let usedIdx = [];              // 이전 회차에 출제된 문제 인덱스

/* ===== 2. 효과음 ===== */
let actx = null;
function tone(freqs, dur){
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === "suspended") actx.resume();
    freqs.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = "sine"; o.frequency.value = f;
      const t = actx.currentTime + i * (dur * 0.8);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.22, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t + dur + 0.05);
    });
  }catch(e){}
}
const sfxCorrect = () => tone([784,1046], 0.18);
const sfxWrong   = () => tone([196], 0.30);
const sfxOver    = () => tone([330,262], 0.28);
const sfxFinish  = () => tone([523,659,784,1046], 0.22);

/* ===== 3. 유틸 ===== */
const EQ = ["①","②","③","④"];
const $ = id => document.getElementById(id);
function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ===== 4. 회차 문제 뽑기 (이전 문제 최대 3개 재사용) ===== */
let roundQuestions = [];
function buildRound(){
  const prev = usedIdx.filter(i => i < BANK.length);
  const reuseCount = Math.min(prev.length, REUSE_MAX, PICK);

  // 이전 문제에서 최대 3개 랜덤 선택
  const reused = shuffle(prev).slice(0, reuseCount);

  // 새 문제 후보: 한 번도 출제되지 않은 문제 우선
  let fresh = BANK.map((_, i) => i).filter(i => !prev.includes(i));
  // 은행이 부족하면 아직 재사용 안 한 문제로 보충
  if(fresh.length < PICK - reuseCount){
    const extra = BANK.map((_, i) => i).filter(i => !reused.includes(i) && !fresh.includes(i));
    fresh = fresh.concat(shuffle(extra));
  }

  const picked = reused.concat(shuffle(fresh).slice(0, PICK - reuseCount));
  roundQuestions = shuffle(picked).map(i => BANK[i]);
  usedIdx = picked.slice();
}

/* ===== 5. 상태 ===== */
let idx = 0, score = 0, tries = 0, locked = false, solved = false;
let log = [], stats = { perfect:0, retry:0, miss:0 };

/* ===== 6. 화면 전환 ===== */
function show(which){
  $("startScreen").style.display  = which === "start"  ? "block" : "none";
  $("quizScreen").style.display   = which === "quiz"   ? "block" : "none";
  $("resultScreen").style.display = which === "result" ? "block" : "none";
}

/* ===== 7. 문제 렌더링 ===== */
function render(){
  const q = roundQuestions[idx];
  tries = 0; solved = false; locked = false;

  $("counter").textContent   = `문제 ${idx + 1} / ${PICK}`;
  $("liveScore").textContent = `현재 ${score}점`;
  $("progressBar").style.width = `${(idx / PICK) * 100}%`;
  $("questionText").textContent = q.q;
  updateTryBadge();

  const box = $("answers");
  box.innerHTML = "";
  q.a.forEach((text, i) => {
    const b = document.createElement("button");
    b.className = "ans";
    b.innerHTML = `<span class="num">${EQ[i]}</span><span>${text}</span>`;
    b.addEventListener("click", () => pick(i, b));
    box.appendChild(b);
  });

  const fb = $("feedback");
  fb.className = "feedback"; fb.textContent = "";
  $("nextBtn").hidden = true;
  $("nextBtn").textContent = (idx === PICK - 1) ? "결과 보기 🏁" : "다음 문제 →";
}

function updateTryBadge(){
  const left = MAX_TRY - tries;
  const badge = $("tryBadge");
  badge.textContent = tries === 0
    ? `시도 1 / ${MAX_TRY}`
    : `남은 기회 ${left}번`;
  badge.className = "trybadge" + (left <= 1 ? " warn" : "");
}

/* ===== 8. 정/오답 판정 ===== */
function pick(choice, btn){
  if(locked) return;

  const q = roundQuestions[idx];
  const buttons = [...document.querySelectorAll(".ans")];
  const fb = $("feedback");

  if(solved) return;
  tries++;

  /* --- 정답 --- */
  if(choice === q.c){
    solved = true; locked = true;
    buttons.forEach(b => b.classList.add("locked"));
    btn.classList.remove("wrong","dead");
    btn.classList.add("correct");
    sfxCorrect();

    const gained = POINTS[tries - 1];
    score += gained;

    const label = tries === 1 ? "정답이에요! 👏" : tries === 2 ? "좋아요! 두 번째에 맞혔어요 👍"
                : tries === 3 ? "맞혔어요! 끝까지 포기하지 않았네요 😊" : "정답! 다음엔 더 빨리 맞혀 봐요 💪";

    fb.className = "feedback ok show";
    fb.innerHTML = `${label} <b>+${gained}점</b><span class="hint">${q.why}</span>`;

    if(tries === 1) stats.perfect++;
    else stats.retry++;

    $("liveScore").textContent = `현재 ${score}점`;
    $("progressBar").style.width = `${((idx + 1) / PICK) * 100}%`;
    $("nextBtn").hidden = false;
    return;
  }

  /* --- 오답 --- */
  btn.classList.add("wrong","shake");
  setTimeout(() => btn.classList.remove("shake"), 450);
  btn.classList.add("dead","locked");
  btn.disabled = true;

  // 남은 기회가 있을 때
  if(tries < MAX_TRY){
    sfxWrong();
    fb.className = "feedback no show";
    fb.innerHTML = `다시 생각해보세요 🤔<span class="hint">남은 기회가 ${MAX_TRY - tries}번 있어요. 다른 답을 골라 보세요!</span>`;
    updateTryBadge();
    return;
  }

  /* --- 4번 모두 오답 → 정답 공개 --- */
  solved = true; locked = true;
  buttons.forEach(b => b.classList.add("locked"));
  buttons[q.c].classList.remove("dead");
  buttons[q.c].classList.add("correct");
  sfxOver();
  stats.miss++;
  log.push({ q:q.q, mine:"4번 모두 오답", correct:q.a[q.c], why:q.why });

  fb.className = "feedback over show";
  fb.innerHTML = `정답을 알려 줄게요 📖<span class="hint">정답은 ${EQ[q.c]} ${q.a[q.c]}이에요. ${q.why}</span>`;

  $("progressBar").style.width = `${((idx + 1) / PICK) * 100}%`;
  $("nextBtn").hidden = false;
}

/* ===== 9. 다음 문제 / 결과 ===== */
$("nextBtn").addEventListener("click", () => {
  idx++;
  if(idx < PICK) render();
  else finish();
});

function finish(){
  show("result");
  sfxFinish();

  $("finalScore").innerHTML = `${score}<span> / 100</span>`;
  $("stPerfect").textContent = stats.perfect;
  $("stRetry").textContent   = stats.retry;
  $("stMiss").textContent    = stats.miss;

  const reusedCount = roundQuestions.length - (PICK - REUSE_MAX) < 0 ? 0 : 0; // 표시용 계산은 아래에서
  const newCount = PICK - Math.min(REUSE_MAX, PICK);
  $("roundInfo").textContent = `이번 회차 · 복습 문제 ${Math.min(REUSE_MAX, PICK)}개 이하 + 새 문제 포함`;

  let msg, sub, stars;
  if(score >= 95){ stars="⭐⭐⭐⭐⭐"; msg="완벽해요! 독도 박사 등극! 🏆"; sub="거의 모든 문제를 한 번에 맞혔어요. 정말 대단해요!"; }
  else if(score >= 80){ stars="⭐⭐⭐⭐"; msg="훌륭해요! 독도 척척박사 🎉"; sub="아주 잘했어요. 틀린 문제만 다시 보면 완벽해요!"; }
  else if(score >= 60){ stars="⭐⭐⭐"; msg="잘했어요! 독도와 한 걸음 더 가까워졌어요 😊"; sub="아래 틀린 문제를 확인하고 다시 도전해 보세요!"; }
  else { stars="⭐⭐"; msg="괜찮아요! 다시 하면 더 잘할 수 있어요 💪"; sub="독도의 날은 10월 25일! 아래 풀이를 읽고 다시 도전해 봐요."; }

  $("stars").textContent = stars;
  $("resultMsg").textContent = msg;
  $("resultSub").textContent = sub;

  const rl = $("reviewList");
  if(log.length === 0){
    rl.innerHTML = `<h3>끝까지 다 맞혔어요 🎈</h3>`;
  } else {
    rl.innerHTML = `<h3>다시 볼 문제 (${log.length}개)</h3>` + log.map(item => `
      <li>
        <b>${item.q}</b>
        <span class="me">${item.mine}</span><br>
        정답 : <span class="co">${item.correct}</span><br>
        <span style="color:#6b7f92">${item.why}</span>
      </li>`).join("");
  }

  // 재도전 시 정답 공개된 문제는 다음 회차 복습 후보로 넘김
  usedIdx = roundQuestions.map(q => BANK.indexOf(q));
}

/* ===== 10. 시작 / 재도전 ===== */
function startQuiz(isRedo){
  buildRound();
  idx = 0; score = 0; tries = 0; locked = false; solved = false;
  log = []; stats = { perfect:0, retry:0, miss:0 };
  show("quiz");
  render();
}
$("startBtn").addEventListener("click", () => startQuiz(false));
$("redoBtn").addEventListener("click", () => startQuiz(true));
</script>
</body>
</html>
