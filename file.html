<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>오늘의 할 일</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --line:#e3e7f0; --text:#1f2430; --muted:#7b8497;
    --accent:#4a6cf7; --study:#4a6cf7; --daily:#12b886; --done:#adb5d1;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:28px 16px 60px; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.5;
  }
  .wrap{max-width:720px; margin:0 auto;}
  header{margin-bottom:20px;}
  h1{margin:0 0 4px; font-size:26px; letter-spacing:-0.5px;}
  .sub{color:var(--muted); font-size:14px;}

  .datebar{display:flex; gap:8px; align-items:center; margin:18px 0 14px;}
  .datebar input[type=date]{
    flex:1; padding:11px 12px; border:1px solid var(--line); border-radius:12px;
    background:var(--card); font-size:15px; color:var(--text); font-family:inherit;
  }
  .btn{
    border:none; border-radius:12px; padding:11px 16px; font-size:14px; font-weight:600;
    cursor:pointer; font-family:inherit; transition:.15s;
  }
  .btn-primary{background:var(--accent); color:#fff;}
  .btn-primary:hover{background:#3a5ae0;}
  .btn-ghost{background:#e9edf8; color:#3d4considered;}
  .btn-ghost{background:#e9edf8; color:#3d4666;}
  .btn-ghost:hover{background:#dde3f5;}

  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:18px;}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; text-align:center;}
  .stat .n{font-size:24px; font-weight:700; letter-spacing:-0.5px;}
  .stat .l{font-size:12px; color:var(--muted); margin-top:2px;}
  .stat.total .n{color:var(--text);}
  .stat.done .n{color:var(--daily);}
  .stat.left .n{color:var(--accent);}

  .bar{height:8px; background:#e3e7f0; border-radius:99px; overflow:hidden; margin-bottom:22px;}
  .bar i{display:block; height:100%; background:var(--daily); border-radius:99px; transition:width .3s;}

  form.add{display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap;}
  form.add input[type=text]{
    flex:1; min-width:180px; padding:12px 14px; border:1px solid var(--line);
    border-radius:12px; font-size:15px; font-family:inherit; background:var(--card);
  }
  form.add select, form.add input[type=date]{
    padding:12px 10px; border:1px solid var(--line); border-radius:12px;
    font-size:14px; font-family:inherit; background:var(--card); color:var(--text);
  }
  :focus-visible{outline:2px solid var(--accent); outline-offset:1px;}

  .group{margin-bottom:22px;}
  .group h2{font-size:15px; margin:0 0 10px; color:var(--muted); font-weight:700;}
  .count{font-weight:500;}

  ul{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;}
  li.item{
    display:flex; align-items:center; gap:10px; background:var(--card);
    border:1px solid var(--line); border-radius:14px; padding:12px 14px;
  }
  li.item.done .title{text-decoration:line-through; color:var(--done);}
  input[type=checkbox]{width:20px; height:20px; accent-color:var(--daily); cursor:pointer; flex:none;}
  .title{flex:1; font-size:15px; word-break:break-word;}
  .title-input{
    flex:1; padding:7px 9px; border:1px solid var(--accent); border-radius:9px;
    font-size:15px; font-family:inherit; min-width:0;
  }
  .tag{
    font-size:11px; font-weight:700; padding:3px 8px; border-radius:99px; flex:none;
  }
  .tag.study{background:#e6ecfe; color:var(--study);}
  .tag.daily{background:#e0f7ef; color:var(--daily);}
  .date-mini{font-size:11px; color:var(--muted); flex:none;}
  .icon{
    border:none; background:transparent; cursor:pointer; font-size:13px; color:var(--muted);
    padding:6px 8px; border-radius:8px; font-family:inherit;
  }
  .icon:hover{background:#eef1f9; color:var(--text);}
  .empty{background:var(--card); border:1px dashed var(--line); border-radius:14px;
    padding:22px; text-align:center; color:var(--muted); font-size:14px;}
  footer{margin-top:30px; text-align:center; font-size:12px; color:var(--muted);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>오늘의 할 일</h1>
    <div class="sub">오늘 해야 할 일을 기록하고, 끝낸 일과 남은 일을 한눈에 확인하세요.</div>
  </header>

  <div class="datebar">
    <input type="date" id="datePicker" />
    <button class="btn btn-ghost" id="todayBtn">오늘</button>
  </div>

  <div class="stats">
    <div class="stat total"><div class="n" id="statTotal">0</div><div class="l">전체</div></div>
    <div class="stat done"><div class="n" id="statDone">0</div><div class="l">완료</div></div>
    <div class="stat left"><div class="n" id="statLeft">0</div><div class="l">남은 일</div></div>
  </div>
  <div class="bar"><i id="progress" style="width:0%"></i></div>

  <form class="add" id="addForm">
    <input type="text" id="newTitle" placeholder="할 일을 입력하세요" maxlength="120" autocomplete="off" />
    <select id="newCat">
      <option value="study">학업</option>
      <option value="daily">일상</option>
    </select>
    <input type="date" id="newDate" />
    <button class="btn btn-primary" type="submit">추가</button>
  </form>

  <section class="group">
    <h2>진행 중 <span class="count" id="cntActive"></span></h2>
    <ul id="listActive"></ul>
  </section>

  <section class="group">
    <h2>완료 <span class="count" id="cntDone"></span></h2>
    <ul id="listDone"></ul>
  </section>

  <footer>모든 내용은 이 브라우저에만 저장됩니다. (localStorage)</footer>
</div>

<script>
(function(){
  "use strict";
  var KEY = "today-todo-v1";
  var CAT = { study:"학업", daily:"일상" };

  var els = {
    datePicker: document.getElementById("datePicker"),
    todayBtn: document.getElementById("todayBtn"),
    addForm: document.getElementById("addForm"),
    newTitle: document.getElementById("newTitle"),
    newCat: document.getElementById("newCat"),
    newDate: document.getElementById("newDate"),
    statTotal: document.getElementById("statTotal"),
    statDone: document.getElementById("statDone"),
    statLeft: document.getElementById("statLeft"),
    progress: document.getElementById("progress"),
    listActive: document.getElementById("listActive"),
    listDone: document.getElementById("listDone"),
    cntActive: document.getElementById("cntActive"),
    cntDone: document.getElementById("cntDone")
  };

  function ymd(d){
    var m = String(d.getMonth()+1).padStart(2,"0");
    var day = String(d.getDate()).padStart(2,"0");
    return d.getFullYear()+"-"+m+"-"+day;
  }
  var TODAY = ymd(new Date());

  var todos = [];
  var editingId = null;

  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      todos = raw ? JSON.parse(raw) : [];
      if(!Array.isArray(todos)) todos = [];
    }catch(e){ todos = []; }
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(todos)); }catch(e){}
  }
  function nextId(){
    return "t" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  }
  function forDate(d){
    return todos.filter(function(t){ return t.date === d; });
  }

  function render(){
    var d = els.datePicker.value || TODAY;
    var list = forDate(d);

    var done = list.filter(function(t){ return t.done; });
    var active = list.filter(function(t){ return !t.done; });

    els.statTotal.textContent = list.length;
    els.statDone.textContent = done.length;
    els.statLeft.textContent = active.length;
    els.progress.style.width = list.length ? (done.length/list.length*100)+"%" : "0%";
    els.cntActive.textContent = active.length ? "("+active.length+")" : "";
    els.cntDone.textContent = done.length ? "("+done.length+")" : "";

    fill(els.listActive, active, "진행 중인 할 일이 없습니다.");
    fill(els.listDone, done, "완료한 할 일이 없습니다.");
  }

  function fill(ul, items, emptyMsg){
    ul.innerHTML = "";
    if(!items.length){
      var li = document.createElement("li");
      li.className = "empty";
      li.textContent = emptyMsg;
      ul.appendChild(li);
      return;
    }
    items.forEach(function(t){ ul.appendChild(row(t)); });
  }

  function row(t){
    var li = document.createElement("li");
    li.className = "item" + (t.done ? " done" : "");
    li.dataset.id = t.id;

    var cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = !!t.done;
    cb.title = "완료 체크";
    cb.addEventListener("change", function(){
      t.done = cb.checked;
      save(); render();
    });
    li.appendChild(cb);

    if(editingId === t.id){
      var input = document.createElement("input");
      input.type = "text";
      input.className = "title-input";
      input.value = t.title;
      input.maxLength = 120;
      input.addEventListener("keydown", function(e){
        if(e.key === "Enter") commit();
        if(e.key === "Escape"){ editingId = null; render(); }
      });
      input.addEventListener("blur", commit);
      li.appendChild(input);

      var sel = document.createElement("select");
      ["study","daily"].forEach(function(c){
        var o = document.createElement("option");
        o.value = c; o.textContent = CAT[c];
        if(t.cat === c) o.selected = true;
        sel.appendChild(o);
      });
      sel.addEventListener("change", function(){ t.cat = sel.value; save(); render(); });
      li.appendChild(sel);

      function commit(){
        var v = input.value.trim();
        if(v) t.title = v;
        editingId = null;
        save(); render();
      }
      setTimeout(function(){ input.focus(); input.select(); }, 0);
      return li;
    }

    var span = document.createElement("span");
    span.className = "title";
    span.textContent = t.title;
    li.appendChild(span);

    var tag = document.createElement("span");
    tag.className = "tag " + (t.cat || "study");
    tag.textContent = CAT[t.cat] || CAT.study;
    li.appendChild(tag);

    var edit = document.createElement("button");
    edit.type = "button";
    edit.className = "icon";
    edit.textContent = "수정";
    edit.addEventListener("click", function(){ editingId = t.id; render(); });
    li.appendChild(edit);

    var del = document.createElement("button");
    del.type = "button";
    del.className = "icon";
    del.textContent = "삭제";
    del.addEventListener("click", function(){
      if(!confirm("'" + t.title + "' 을(를) 삭제할까요?")) return;
      todos = todos.filter(function(x){ return x.id !== t.id; });
      save(); render();
    });
    li.appendChild(del);

    return li;
  }

  function setDate(d){
    els.datePicker.value = d;
    els.newDate.value = d;
    render();
  }

  els.addForm.addEventListener("submit", function(e){
    e.preventDefault();
    var title = els.newTitle.value.trim();
    if(!title) return;
    todos.push({
      id: nextId(),
      title: title,
      cat: els.newCat.value,
      date: els.newDate.value || els.datePicker.value || TODAY,
      done: false,
      createdAt: Date.now()
    });
    els.newTitle.value = "";
    save();
    setDate(els.newDate.value || els.datePicker.value || TODAY);
    els.newTitle.focus();
  });

  els.datePicker.addEventListener("change", function(){
    els.newDate.value = els.datePicker.value;
    render();
  });

  els.todayBtn.addEventListener("click", function(){ setDate(TODAY); });

  load();
  setDate(TODAY);
})();
</script>
</body>
</html>
